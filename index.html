<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kapitolyo High School - Student Portal </title>
</head>
<link rel="stylesheet" href="style.css">
<script src="main.js"></script>
<body>
<header>
    <h1>Kapitolyo High School</h1>
    <p>Grade Management System</p>
</header>
<nav>
    <button onclick="topnav()">Home</button>
    <button onclick="showGrades()">Grades</button>
    <button onclick="showAcademicPerformance()">Academic Performance</button>
    <button onclick="showProfile()">Profile</button>   
</nav>

 <!--pang role picker-->
  <section id="rolePage">
    <h2>Select User</h2>
    <p class="sub">Choose Who you are, then go to the login</p>
    <ul class="roles">
        <li id="role_admin" onclick="pickRole('admin')">
            <span class="pic" style="background: #a1a19d;">A</span>
            <span><span class="rname">Admin</span></span>
            <span class="rinfo">Manage users,classes and Settings</span>
            <span class="tick">&#10003;</span><!--check-->
        </li>
        <li id="role_eacher" onclick="pickRole('teacher')">
             <span class="pic" style="background: #a1a19d;">T</span>
            <span><span class="rname">Teacher</span></span>
            <span class="rinfo">Enter and compute grades</span>
            <span class="tick">&#10003;</span><!--check-->
        </li>
        <li id="role_student" onclick="pickRole('student')">
             <span class="pic" style="background: #a1a19d;">S</span>
            <span><span class="rname">Student</span></span>
            <span class="rinfo">View grades</span>
            <span class="tick">&#10003;</span><!--check-->
       </li>     
    </ul>
</body>
 <!--para sa login-->
    <section id="loginPage">
    <h2>Kapitolyo High School</h2>
    <form onsubmit="return false">
         <div class="container">
    <label for="uname"><b>Username</b></label>
    <input type="text" placeholder="Enter Username" name="uname" required><br><br>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" required><br><br>

    <button type="submit">Login</button><br><br>
    <label>
      <input type="checkbox" checked="checked" name="remember"> Remember me
    </label>
  </div>

  <div class="container" style="background-color:#f1f1f1">
    <button type="button" class="cancelbtn">Cancel</button><br><br>
    <span class="psw">Forgot <a href="#">password?</a></span>
  </div>
</form>  
</html>
